name: Update Fontan Digest

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4,10,16,22 * * *'
  push:
    paths:
      - 'config/**'
      - 'scripts/update_pubmed.py'
      - 'docs/app.js'
      - 'docs/index.html'
      - 'docs/styles.css'
      - '.github/workflows/update-fontan-digest.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate application
        run: |
          python -m py_compile scripts/update_pubmed.py
          node --check docs/app.js

      - name: Refresh Fontan literature
        run: python scripts/update_pubmed.py

      - name: Commit refreshed digest
        run: |
          if [ -z "$(git status --porcelain -- docs/data)" ]; then
            echo "No literature changes"
            exit 0
          fi
          git config user.name "fontan-digest[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Update Fontan literature digest"
          git push
